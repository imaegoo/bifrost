name: Build fork image (arm64)

on:
  push:
    branches: [dev]
  workflow_dispatch: {}

concurrency:
  group: build-fork-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Resolve image tags
        id: meta
        env:
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          VERSION="$(tr -d '[:space:]' < transports/version)"
          SHA="$(git rev-parse --short=12 HEAD)"
          {
            echo "image=${IMAGE}"
            echo "version=${VERSION}"
            echo "sha=${SHA}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: transports/Dockerfile.local
          platforms: linux/arm64
          push: true
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}-${{ steps.meta.outputs.sha }}
